# This workflow creates a GitHub release and publishes the NuGet package.
name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

env:
  PROJECT_PATH: src/SimpleMediator/SimpleMediator.csproj
  TEST_PROJECT_PATH: SimpleMediator.sln
  
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' is not a valid semantic version tag. Expected vX.Y.Z."
            exit 1
          fi
          echo "package_version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup .NET 8 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore -p:Version=${{ steps.version.outputs.package_version }}

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.package_version }}
      
      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build -p:Version=${{ steps.version.outputs.package_version }} -p:PackageVersion=${{ steps.version.outputs.package_version }} -o ./artifacts

      - name: Verify package version
        shell: bash
        run: |
          package_version=$(unzip -p ./artifacts/*.nupkg '*.nuspec' | awk -F'[<>]' '/<version>/{print $3; exit}')
          if [[ "$package_version" != "${{ steps.version.outputs.package_version }}" ]]; then
            echo "Expected package version ${{ steps.version.outputs.package_version }}, found $package_version."
            exit 1
          fi

      - name: Verify package consumer
        run: bash eng/verify-package.sh ./artifacts ${{ steps.version.outputs.package_version }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Symbols
        id: create_release_symbols
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}