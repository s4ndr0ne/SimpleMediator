# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write

    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Setup .NET 8 runtime
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Check vulnerable packages
      run: dotnet list package --vulnerable --include-transitive
    - name: Test
      run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings

  package-smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Setup .NET 8 runtime
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Pack
      # Packs every IsPackable project: the runtime library and the source generator.
      run: dotnet pack SimpleMediator.sln --configuration Release --no-build -p:Version=0.0.0-ci -p:PackageVersion=0.0.0-ci -o ./artifacts
    - name: Verify package consumer
      run: bash eng/verify-package.sh ./artifacts 0.0.0-ci

  # Native AOT smoke test. The sample registers the console handlers through the source generator
  # (AddSimpleMediatorGenerated) and is published with PublishAot: the publish must produce no
  # trim/AOT warning at all, and the self-checking native binary must exit 0 (request/response,
  # void/Unit, value-type and open-generic dispatch, behaviors, pre/post, notifications, exceptions).
  aot-smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Install Native AOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
    - name: Publish (Native AOT)
      run: |
        set -o pipefail
        dotnet publish samples/SimpleMediator.AotSample --configuration Release -o ./artifacts/aot 2>&1 | tee aot-publish.log
    - name: Fail on any trim/AOT warning
      run: |
        if grep -E "(warning|error) IL[0-9]{4}" aot-publish.log; then
          echo "::error::Native AOT publish produced trim/AOT warnings."
          exit 1
        fi
    - name: Run native binary
      run: ./artifacts/aot/SimpleMediator.AotSample
